<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>逐页 UI 审阅</title>
<style>
:root{--purple:#4c2a71;--lime:#adcf37;--ink:#252129;--muted:#6b6571;--line:#ded6e5;--paper:#f6f4f8;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;font-size:15px;color:var(--ink);line-height:1.65}*{box-sizing:border-box}body{margin:0;background:var(--paper)}[hidden]{display:none!important}button,input,textarea,select{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}a{color:var(--purple)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #9064bb;outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:260px;background:#141514;color:#fff;padding:25px 16px;overflow:auto}aside h1{font-size:19px;margin:0 10px}aside p{font-size:12px;color:#b9b1c3;margin:6px 10px 20px}nav button{display:flex;gap:11px;align-items:center;width:100%;border:0;background:transparent;color:#d0c9d7;border-radius:7px;padding:10px 12px;margin:3px 0;text-align:left;font-size:13px}nav button:hover{background:#302737}nav button[aria-current=page]{background:var(--purple);color:white;box-shadow:inset 3px 0 var(--lime)}.nav-id{color:var(--lime);font-variant-numeric:tabular-nums}.nav-label{flex:1}.nav-state{font-size:10px;color:#d6d0df;white-space:nowrap}.nav-state.confirmed{color:var(--lime)}main{margin-left:260px;padding:28px 32px;max-width:1900px}.top{display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}h2{font-size:25px;line-height:1.4;margin:0}h3{font-size:20px;margin:0 0 6px}p{margin:6px 0 14px}.muted{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{padding:9px 14px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--purple);font-size:13px;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:5px}.btn.primary{background:var(--purple);color:#fff;border-color:var(--purple)}.btn:hover:not(:disabled){box-shadow:0 2px 8px #4c2a7115}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:18px 0}.toolbar .btn[aria-pressed=true]{background:var(--purple);border-color:var(--purple);color:#fff}.push{margin-left:auto}.summary{display:flex;gap:15px;align-items:center;flex-wrap:wrap;background:#eee8f4;border:1px solid #e1d6eb;padding:11px 15px;border-radius:9px;margin:20px 0;font-size:12px}.save-state{margin-left:auto;color:#5c5265}.save-state.error{color:#9d3131}.canvas{width:100%;max-width:1500px;margin:0 auto;background:white;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 10px 30px #30213e09}.canvas.mobile{max-width:440px}.canvas img{display:block;width:100%;height:auto}.feedback{background:white;border:1px solid var(--line);border-top:3px solid var(--purple);border-radius:12px;padding:26px;margin-top:25px;scroll-margin-top:24px}.feedback-head{display:flex;justify-content:space-between;gap:15px;align-items:start;flex-wrap:wrap}.status-label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:10px}select{max-width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);padding:9px 12px;min-height:42px}label[for=page-notes]{display:block;margin:14px 0 9px;font-size:14px;font-weight:600}textarea{display:block;width:100%;min-height:170px;resize:vertical;border:1px solid #cbbdd6;border-radius:9px;padding:15px 16px;color:var(--ink);background:#fefcfe;line-height:1.8}textarea::placeholder{color:#84798d}textarea:focus{border-color:var(--purple)}.feedback-foot{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap}.global-box{margin-top:22px;border:1px solid var(--line);border-radius:10px;padding:18px 22px;background:#fff}.global-box summary{cursor:pointer;color:var(--purple);font-weight:600}.global-box label{display:block;font-size:13px;margin:14px 0 8px}.global-box textarea{min-height:110px}.bottom{display:flex;justify-content:space-between;gap:10px;margin:24px 0}.notice{padding:12px 15px;margin:15px 0;background:#fff;border:1px solid var(--line);border-radius:8px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}.notice.error{background:#fff4f3;color:#9d3131;border-color:#edc8c8}.notice.success{color:#34613b}.hint{font-size:12px;color:var(--muted)}.import-panel{margin-top:18px;padding:18px;border:1px solid #c9b5dc;background:#fff;border-radius:10px}.import-panel .actions{margin-top:12px}.sticky-jump{position:fixed;right:24px;bottom:22px;box-shadow:0 5px 20px #2e17352b;z-index:5}.caption{font-size:12px;color:var(--muted);margin:12px 0}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:900px){aside{position:static;width:auto;padding:18px}aside p{margin-bottom:12px}nav{display:flex;gap:6px;overflow:auto}nav button{width:auto;flex-shrink:0;white-space:nowrap}main{margin:0;padding:22px 15px}.top{gap:12px}h2{font-size:22px}.actions{width:100%}.top .actions .btn{flex:1}.feedback{padding:20px 16px}.save-state{margin-left:0}.summary{gap:6px 15px}.sticky-jump{right:15px;bottom:14px}.feedback-foot .hint{flex-basis:100%}.push{margin-left:0}.toolbar{gap:7px}.global-box{padding:18px 16px}.bottom{padding-bottom:40px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head>
<body>
<aside><h1 id="project-title"></h1><p id="project-meta"></p><nav aria-label="选择审阅页面"></nav></aside>
<main>
<div class="top"><div><p class="eyebrow">UI REVIEW / 逐页设计审阅</p><h2 id="page-title"></h2></div><div class="actions"><button id="export-md" class="btn primary" type="button">导出全部意见 ↓</button><button id="export-json" class="btn" type="button">导出备份</button><button id="import-trigger" class="btn" type="button">导入备份</button><input id="import-file" type="file" accept=".json,application/json" hidden></div></div>
<p id="page-note" class="muted"></p><p id="description" class="hint"></p>
<div class="summary"><strong id="progress"></strong><span id="notes-count"></span><span id="save-state" class="save-state" role="status"></span></div>
<div id="notice" class="notice" role="status" hidden></div>
<section id="import-panel" class="import-panel" aria-labelledby="import-title" hidden><h3 id="import-title">核对导入意见</h3><p id="import-summary"></p><p class="hint">确认后将使用备份中的意见替换当前草稿；不同项目或不同设计版本的文件不会导入。</p><div class="actions"><button id="confirm-import" class="btn primary" type="button">确认导入</button><button id="cancel-import" class="btn" type="button">取消</button><button id="backup-current" class="btn" type="button">先导出当前草稿</button></div></section>
<div class="toolbar"><div id="view-buttons" class="actions" style="width:auto"></div><a id="original-image" class="btn push" target="_blank" rel="noopener">查看原尺寸 ↗</a><button id="jump-notes" class="btn" type="button">填写本页意见 ↓</button></div>
<div class="canvas"><img id="screen" alt=""></div><p class="caption">上方为设计截图；每页的意见独立保存。需要区分尺寸时，请在意见中写明“电脑端”或“手机端”。</p>
<section id="feedback" class="feedback" aria-labelledby="feedback-title"><div class="feedback-head"><div><h3 id="feedback-title"></h3><p class="muted">把想调整的地方写在这里，切换页面后不会丢失。</p></div><label class="status-label" for="review-status">审阅状态<select id="review-status"><option value="unreviewed">未审阅</option><option value="changes">需要修改</option><option value="approved">本页确认</option></select></label></div><label for="page-notes">本页修改意见</label><textarea id="page-notes" placeholder="例如：&#10;1. Logo 再放大一点。&#10;2. 手机端标题改成两行。&#10;3. 主按钮保留紫色，减少卡片边框。"></textarea><div class="feedback-foot"><span id="page-save" class="hint" role="status"></span><button id="next-from-notes" class="btn" type="button">保存并看下一页 →</button><span class="hint">意见仅保存在当前浏览器；点击“导出全部意见”后，把下载的文件发给我。</span></div></section>
<details class="global-box"><summary>整个项目的统一修改意见</summary><label for="global-notes">适用于所有页面的意见</label><textarea id="global-notes" placeholder="例如：整体增加留白；所有按钮统一圆角；全站标题减小一档。"></textarea></details>
<div class="bottom"><button id="prev" class="btn" type="button">← 上一页</button><button id="next" class="btn" type="button">下一页 →</button></div>
</main><button id="floating-notes" class="btn primary sticky-jump" type="button">本页意见 ↓</button>
<script id="review-data" type="application/json">{"schema": "frontend-ui-review-board/v1", "projectId": "atlas-workspace-demo", "title": "Atlas Workspace · UI Review Demo", "revision": "demo-v1", "description": "A fictional, privacy-safe example for demonstrating the frontend-ui-review workflow. All copy and metrics are invented.", "entries": [{"id": "01", "title": "Sign-in", "note": "Brand mark, sign-in form, and primary action.", "kind": "Page", "views": [{"id": "desktop", "label": "Desktop", "image": "01-desktop.png", "sha256": "a0d9427338da31ca0d5c5d33f94214ea2a8e9dab1e92f86a3d0653820f5ecbc8"}]}, {"id": "02", "title": "Overview dashboard", "note": "Navigation rail, metric cards, progress chart, and activity list.", "kind": "Page", "views": [{"id": "desktop", "label": "Desktop", "image": "02-desktop.png", "sha256": "6e32887a47ad613d9b132bda9e7b0efa23ce84e4330240243def46038cade2e5"}]}, {"id": "03", "title": "Knowledge article", "note": "Mobile reading layout with search, article content, and save action.", "kind": "Page", "views": [{"id": "mobile", "label": "Mobile", "image": "03-mobile.png", "sha256": "30f40bea12ce5aa4555a38f37456eb993789f40a3ed79a34386a8ebe7c79d0f9"}]}]}</script>
<script>
'use strict';
(() => {
 const config=JSON.parse(document.getElementById('review-data').textContent),pages=config.entries,$=id=>document.getElementById(id);
 const key=`frontend-ui-review:v1:${config.projectId}:${config.revision}`;
 const statusNames={unreviewed:'未审阅',changes:'需要修改',approved:'本页确认'};
 let selected=0,mode=pages[0].views[0].id,pendingImport=null,storageAvailable=true,draft;
 const blank=()=>({schema:'frontend-ui-review-feedback/v1',projectId:config.projectId,revision:config.revision,globalNotes:'',updatedAt:null,pages:pages.map(p=>({id:p.id,status:'unreviewed',notes:'',updatedAt:null}))});
 function validate(value){
  if(!value||typeof value!=='object'||value.schema!=='frontend-ui-review-feedback/v1')throw Error('这不是有效的 UI 审阅备份文件。');
  if(value.projectId!==config.projectId)throw Error('此备份属于其他项目，未导入。');
  if(value.revision!==config.revision)throw Error('此备份属于其他设计版本，未导入。请在对应版本的目录中打开。');
  if(typeof value.globalNotes!=='string'||!Array.isArray(value.pages)||value.pages.length!==pages.length)throw Error('备份页面清单不匹配，未导入。');
  const seen=new Set();
  for(const item of value.pages){if(!item||!pages.some(p=>p.id===item.id)||seen.has(item.id)||!Object.hasOwn(statusNames,item.status)||typeof item.notes!=='string'||(item.updatedAt!==null&&typeof item.updatedAt!=='string'))throw Error('备份中的页面或意见格式不正确，未导入。');seen.add(item.id);}
  return {schema:value.schema,projectId:value.projectId,revision:value.revision,globalNotes:value.globalNotes,updatedAt:typeof value.updatedAt==='string'?value.updatedAt:null,pages:pages.map(p=>{const r=value.pages.find(i=>i.id===p.id);return{id:r.id,status:r.status,notes:r.notes,updatedAt:r.updatedAt};})};
 }
 function announce(text,type=''){const n=$('notice');n.textContent=text;n.className='notice'+(type?' '+type:'');n.hidden=false;}
 try{const raw=localStorage.getItem(key);draft=raw?validate(JSON.parse(raw)):blank();}catch(e){draft=blank();storageAvailable=false;announce('无法读取浏览器草稿。请保留已有备份；本次填写后及时导出。','error');}
 function pageDraft(){return draft.pages.find(p=>p.id===pages[selected].id);}
 function refreshProgress(){
  const reviewed=draft.pages.filter(p=>p.status!=='unreviewed').length,noted=draft.pages.filter(p=>p.notes.trim()).length;
  $('progress').textContent=`已审阅 ${reviewed} / ${pages.length} 页`;$('notes-count').textContent=`${noted} 页有修改意见`;
  document.querySelectorAll('nav button').forEach((b,i)=>{const r=draft.pages.find(x=>x.id===pages[i].id),tag=b.querySelector('.nav-state');tag.textContent=r.status==='approved'?'已确认':r.status==='changes'?'需修改':r.notes.trim()?'有意见':'';tag.classList.toggle('confirmed',r.status==='approved');});
  $('save-state').textContent=storageAvailable?(draft.updatedAt?'已保存到本浏览器 · '+new Date(draft.updatedAt).toLocaleTimeString('zh-CN'):'填写后自动保存在本浏览器'):'浏览器无法保存，请及时导出';$('save-state').classList.toggle('error',!storageAvailable);
 }
 function persist(){draft.updatedAt=new Date().toISOString();if(storageAvailable){try{localStorage.setItem(key,JSON.stringify(draft));}catch(e){storageAvailable=false;announce('浏览器未能保存意见。当前内容仍在页面中，请立即导出备份。','error');}}refreshProgress();$('page-save').textContent=storageAvailable?'本页意见已保存':'尚未写入浏览器，请导出备份';}
 function renderView(){const page=pages[selected],view=page.views.find(v=>v.id===mode)||page.views[0];mode=view.id;$('screen').src=view.image;$('screen').alt=page.title+' · '+view.label;$('original-image').href=view.image;document.querySelector('.canvas').classList.toggle('mobile',mode==='mobile');const controls=$('view-buttons');controls.replaceChildren();for(const v of page.views){const b=document.createElement('button');b.type='button';b.className='btn';b.textContent=v.label;b.setAttribute('aria-pressed',String(v.id===mode));b.addEventListener('click',()=>{mode=v.id;renderView();});controls.append(b);}}
 function render(){const found=pages.findIndex(p=>p.id===location.hash.slice(1));selected=found<0?0:found;const p=pages[selected],record=pageDraft();$('page-title').textContent=p.id+' / '+p.title;$('page-note').textContent=p.note;$('feedback-title').textContent=p.id+' · '+p.title+'的修改意见';$('page-notes').value=record.notes;$('review-status').value=record.status;$('global-notes').value=draft.globalNotes;$('page-save').textContent=record.updatedAt?'上次编辑：'+new Date(record.updatedAt).toLocaleString('zh-CN'):'本页尚未填写';$('prev').disabled=selected===0;$('next').disabled=selected===pages.length-1;$('next-from-notes').textContent=selected===pages.length-1?'导出全部意见 ↓':'保存并看下一页 →';document.querySelectorAll('nav button').forEach((b,i)=>{if(i===selected)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});renderView();refreshProgress();}
 $('project-title').textContent=config.title;$('project-meta').textContent=`${pages.length} 个界面 · ${config.revision}`;$('description').textContent=config.description;document.title=config.title+' · UI 审阅';
 for(const p of pages){const b=document.createElement('button');b.type='button';for(const [cls,text] of [['nav-id',p.id],['nav-label',p.title],['nav-state','']]){const s=document.createElement('span');s.className=cls;s.textContent=text;b.append(s);}b.addEventListener('click',()=>{location.hash=p.id;});document.querySelector('nav').append(b);}
 $('page-notes').addEventListener('input',()=>{const r=pageDraft();r.notes=$('page-notes').value;r.updatedAt=new Date().toISOString();r.status='changes';$('review-status').value=r.status;persist();});
 $('review-status').addEventListener('change',()=>{const r=pageDraft();r.status=$('review-status').value;r.updatedAt=new Date().toISOString();persist();});
 $('global-notes').addEventListener('input',()=>{draft.globalNotes=$('global-notes').value;persist();});
 function goto(offset){const p=pages[selected+offset];if(p)location.hash=p.id;}
 $('prev').onclick=()=>goto(-1);$('next').onclick=()=>goto(1);$('next-from-notes').onclick=()=>{if(selected===pages.length-1)exportMarkdown();else goto(1);};
 function jump(){$('feedback').scrollIntoView({block:'start'});$('page-notes').focus({preventScroll:true});}
 $('jump-notes').onclick=jump;$('floating-notes').onclick=jump;
 const observer=new IntersectionObserver(entries=>{$('floating-notes').hidden=entries[0].isIntersecting;},{threshold:0.05});observer.observe($('feedback'));
 function snapshot(){return {...draft,projectTitle:config.title,exportedAt:new Date().toISOString(),pages:pages.map(p=>({...draft.pages.find(r=>r.id===p.id),title:p.title,kind:p.kind,views:p.views.map(v=>({id:v.id,label:v.label,image:v.image,sha256:v.sha256}))}))};}
 function filename(ext){return `${config.projectId}_${config.revision}_修改意见_${new Date().toISOString().replace(/[:.]/g,'-')}.${ext}`;}
 function download(content,type,ext){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename(ext);document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);announce('已生成下载文件，请将文件发送到对话中。','success');}
 function exportMarkdown(){const s=snapshot(),lines=[`# ${config.title} · UI 修改意见`,'',`- 项目 ID：${config.projectId}`,`- 设计版本：${config.revision}`,`- 导出时间：${s.exportedAt}`,`- 页面数量：${pages.length}`,'','## 整体修改意见','',s.globalNotes.trim()||'（未填写）','','---'];for(const p of s.pages){lines.push('',`## ${p.id} · ${p.title}`,'',`- 审阅状态：${statusNames[p.status]}`,`- 界面类型：${p.kind}`,`- 对应截图：${p.views.map(v=>v.image).join(' / ')}`,'','### 修改意见','',p.notes.trim()||'（未填写）','','---');}lines.push('','说明：未填写不代表确认；本文件记录 UI 反馈，正式开发阶段由用户另行确认。','');download('\uFEFF'+lines.join('\n'),'text/markdown;charset=utf-8','md');}
 function exportJson(){download(JSON.stringify(snapshot(),null,2),'application/json;charset=utf-8','json');}
 $('export-md').onclick=exportMarkdown;$('export-json').onclick=exportJson;$('backup-current').onclick=exportJson;
 $('import-trigger').onclick=()=>{$('import-file').value='';$('import-file').click();};
 $('import-file').addEventListener('change',async()=>{const f=$('import-file').files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('备份文件超过 10MB，请核对文件。');pendingImport=validate(JSON.parse(await f.text()));$('import-summary').textContent=`同一项目、同一版本，共 ${pendingImport.pages.length} 页，其中 ${pendingImport.pages.filter(p=>p.notes.trim()).length} 页有意见。`;$('import-panel').hidden=false;$('confirm-import').focus();}catch(e){pendingImport=null;$('import-panel').hidden=true;announce(e.message||'无法读取备份，原草稿未改变。','error');}});
 $('confirm-import').onclick=()=>{if(!pendingImport)return;draft=pendingImport;pendingImport=null;$('import-panel').hidden=true;persist();render();announce('意见备份已导入。','success');};$('cancel-import').onclick=()=>{pendingImport=null;$('import-panel').hidden=true;$('import-trigger').focus();};
 $('screen').addEventListener('error',()=>announce('截图加载失败，请保留图片文件并通过完整审阅目录打开。意见仍可填写与导出。','error'));
 window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});
 window.addEventListener('storage',event=>{if(event.key===key&&event.newValue){storageAvailable=false;refreshProgress();announce('另一个窗口更新了本项目的草稿。本窗口已暂停写入，避免相互覆盖。请先导出本窗口意见，再刷新读取最新草稿。','error');}});
 render();
})();
</script></body></html>
